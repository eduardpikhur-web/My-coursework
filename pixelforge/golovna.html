<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>PixelForge Studio</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #0d0d1a;
            overflow: hidden;
        }

        /* Кнопка бургера */
        .burger-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 1000;
            width: 44px;
            height: 44px;
            background: rgba(123, 47, 255, 0.85);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(123, 47, 255, 0.5);
            transition: background 0.3s ease;
        }

        .burger-btn:hover {
            background: rgba(123, 47, 255, 1);
        }

        .burger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* Коли меню відкрите — анімація ліній в хрестик */
        .burger-btn.open span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .burger-btn.open span:nth-child(2) {
            opacity: 0;
        }
        .burger-btn.open span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* Затемнення фону при відкритому меню */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 800;
        }
        .overlay.active { display: block; }

        /* Виїжджаюче меню */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100vh;
            z-index: 900;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Основна структура */
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            flex: 0 0 20%;
            min-height: 150px;
        }

        .main-section {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .content {
            flex: 1;
        }

        footer {
            flex: 0 0 30%;
            min-height: 280px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

<!-- Кнопка бургера -->
<button class="burger-btn" id="burgerBtn" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- Затемнення -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- Виїжджаюче меню -->
<div class="sidebar" id="sidebar">
    <iframe src="menu.html" scrolling="auto"></iframe>
</div>

<div class="wrapper">
    <header>
        <iframe src="logo.html" scrolling="no"></iframe>
    </header>

    <div class="main-section">
        <main class="content">
            <iframe src="content.html" name="A" scrolling="auto"></iframe>
        </main>
</div>

<script>
    function toggleMenu() {
        const btn     = document.getElementById('burgerBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        btn.classList.toggle('open');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    }
</script>

</body>
</html>
