<html>
<head>
<meta charset="UTF-8">
<title>logo</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
        display: flex;
        align-items: center;
        height: 100%;
        overflow: hidden;
    }

    .logo-area {
        display: flex;
        align-items: center;
        padding: 15px 30px;
        gap: 20px;
        width: 100%;
    }

    .logo-icon {
        font-size: 70px;
        line-height: 1;
        filter: drop-shadow(0 0 15px #7b2fff);
    }

    .logo-text {
        flex: 1;
        text-align: center;
    }

    .logo-text h1 {
        margin: 0;
        font-size: 38px;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 0 20px #7b2fff, 0 0 40px #7b2fff;
    }

    .logo-text p {
        margin: 5px 0 0 0;
        font-size: 14px;
        color: #a78bfa;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    .tagline {
        padding: 10px 30px;
        text-align: right;
        color: #64748b;
        font-size: 13px;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-style: italic;
    }
</style>
</head>
<body>
<div class="logo-area">
    <div class="logo-text">
        <h1>PixelForge Studio</h1>
        <p>Indie Game Development Since 2021</p>
    </div>
    <div class="tagline">Створюємо світи.<br>Де кожен піксель — це мистецтво.</div>
</div>
</body>
</html>
